<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valeoyoga</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #eef3f6;
      --ink: #17201c;
      --muted: #667085;
      --line: #dce3ea;
      --sage: #18a38d;
      --sage-dark: #0b6f65;
      --clay: #ff8a65;
      --sky: #5d7cfa;
      --danger: #aa3328;
      --shadow: 0 18px 48px rgba(24, 33, 45, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #ffffff 0, rgba(255, 255, 255, 0) 280px),
        linear-gradient(135deg, rgba(24, 163, 141, 0.12), rgba(93, 124, 250, 0.08) 48%, rgba(255, 138, 101, 0.08)),
        var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 14px 12px 28px;
    }

    header {
      padding: 6px 0 14px;
    }

    .brand-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(31, 35, 33, 0.08);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(239, 247, 249, 0.92)),
        var(--surface);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .wordmark {
      margin: 0;
      color: var(--ink);
      font-size: 36px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 520px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 5px;
      margin: 14px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 249, 0.7);
      box-shadow: 0 8px 24px rgba(68, 54, 43, 0.08);
    }

    .tab {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--sage-dark), var(--sage));
      color: #fff;
      box-shadow: 0 8px 18px rgba(11, 111, 101, 0.2);
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    .class-card,
    .booking-card,
    .notice {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid rgba(31, 35, 33, 0.08);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .class-card {
      overflow: hidden;
    }

    .class-hero {
      display: grid;
      gap: 14px;
      padding: 18px;
      background:
        linear-gradient(135deg, rgba(24, 163, 141, 0.12), rgba(255, 255, 255, 0.96) 54%, rgba(93, 124, 250, 0.08)),
        var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .class-top,
    .booking-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--sage-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .class-name,
    .booking-name {
      margin: 0;
      font-size: 28px;
      line-height: 1.04;
      font-weight: 850;
      letter-spacing: 0;
    }

    .booking-name {
      font-size: 22px;
    }

    .badge {
      flex: 0 0 auto;
      border: 1px solid rgba(47, 95, 73, 0.14);
      border-radius: 999px;
      background: #e8f7f4;
      color: var(--sage-dark);
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .session-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .meta-chip {
      min-height: 54px;
      border: 1px solid rgba(31, 35, 33, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      padding: 9px 10px;
    }

    .meta-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      margin-bottom: 3px;
    }

    .meta-value {
      display: block;
      color: var(--ink);
      font-size: 16px;
      font-weight: 780;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .booking-card {
      padding: 16px;
    }

    .booking-details {
      margin-top: 8px;
    }

    .form-grid {
      display: grid;
      gap: 14px;
      padding: 18px;
      background: var(--surface);
    }

    label,
    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
    }

    input {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 11px 13px;
      font: inherit;
      font-size: 16px;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    input:focus {
      border-color: rgba(95, 128, 104, 0.65);
      box-shadow: 0 0 0 4px rgba(95, 128, 104, 0.14);
    }

    input::placeholder {
      color: #9a948d;
    }

    .format-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .format-option {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 10px 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 760;
      cursor: pointer;
    }

    .format-option.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 6px 16px rgba(68, 54, 43, 0.12);
    }

    .format-option[data-format="online"].active {
      color: var(--sage-dark);
    }

    .format-option[data-format="offline"].active {
      color: #a14c32;
    }

    button {
      min-height: 50px;
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      padding: 12px 14px;
      font: inherit;
      font-weight: 820;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .submit-button {
      width: 100%;
      margin-top: 2px;
      background: linear-gradient(135deg, var(--sage-dark), var(--sage));
      box-shadow: 0 14px 24px rgba(47, 95, 73, 0.22);
    }

    .delete {
      min-height: 44px;
      background: #fff3f1;
      border: 1px solid rgba(170, 51, 40, 0.18);
      color: var(--danger);
      padding: 8px 12px;
      font-size: 13px;
    }

    .notice {
      padding: 18px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--muted);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {
      main {
        padding: 16px 12px 28px;
      }

      .brand-card {
        padding: 16px;
      }

      .wordmark {
        font-size: 32px;
      }

      .subtitle {
        font-size: 15px;
      }

      .class-name {
        font-size: 26px;
      }

      .class-hero,
      .form-grid {
        padding: 16px;
      }

      .class-top,
      .booking-top {
        align-items: flex-start;
      }

      .badge {
        width: fit-content;
      }

      .session-meta {
        grid-template-columns: 1fr;
      }

      .delete {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand-card">
        <h1 class="wordmark">Valeoyoga</h1>
        <p class="subtitle">Обери заняття, формат і залиш ім'я. Ми збережемо запис у розкладі.</p>
      </div>
    </header>

    <div class="toolbar" role="tablist" aria-label="Розділи">
      <button class="tab active" id="classesTab" type="button">Заняття</button>
      <button class="tab" id="bookingsTab" type="button">Мої записи</button>
    </div>

    <section id="classesView" class="stack"></section>
    <section id="bookingsView" class="stack hidden"></section>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxLBAyJqy1iO2Pvt97sUbqkqs7eZxlv3PZZYgdplA18tJBqqNWOsXCddAGg50_0Xch7/exec';

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const state = {
      classes: [],
      bookings: [],
      loading: false
    };

    const classesView = document.querySelector('#classesView');
    const bookingsView = document.querySelector('#bookingsView');
    const classesTab = document.querySelector('#classesTab');
    const bookingsTab = document.querySelector('#bookingsTab');

    classesTab.addEventListener('click', () => showView('classes'));
    bookingsTab.addEventListener('click', () => showView('bookings'));

    function showView(view) {
      const isClasses = view === 'classes';
      classesTab.classList.toggle('active', isClasses);
      bookingsTab.classList.toggle('active', !isClasses);
      classesView.classList.toggle('hidden', !isClasses);
      bookingsView.classList.toggle('hidden', isClasses);
      if (!isClasses) renderBookings();
    }

    async function request(action, options = {}) {
      const url = options.method === 'POST' ? API_URL : `${API_URL}?action=${encodeURIComponent(action)}`;
      const response = await fetch(url, {
        method: options.method || 'GET',
        headers: options.method === 'POST' ? { 'Content-Type': 'text/plain;charset=utf-8' } : undefined,
        body: options.body ? JSON.stringify({ action, ...options.body }) : undefined
      });
      return response.json();
    }

    async function loadData() {
      setLoading(true);
      try {
        const [classes, bookings] = await Promise.all([
          request('getClasses'),
          request('getBookings')
        ]);
        state.classes = Array.isArray(classes) ? classes : [];
        state.bookings = Array.isArray(bookings) ? bookings : [];
        renderClasses();
        renderBookings();
      } catch (error) {
        classesView.innerHTML = `<div class="notice">Не вдалося завантажити дані. Перевір API URL і доступ до Apps Script.</div>`;
      } finally {
        setLoading(false);
      }
    }

    function renderClasses() {
      if (!state.classes.length) {
        classesView.innerHTML = '<div class="notice">Поки немає занять. Додай рядки на аркуш Classes у Google Таблиці.</div>';
        return;
      }

      classesView.innerHTML = state.classes.map(item => `
        <article class="class-card">
          <div class="class-hero">
            <div class="class-top">
              <div>
                <p class="eyebrow">Доступне заняття</p>
                <h2 class="class-name">${escapeHtml(item.name || 'Заняття')}</h2>
              </div>
              <span class="badge">${escapeHtml(item.offlineSpots || '0')} місць</span>
            </div>
            <div class="session-meta">
              <div class="meta-chip">
                <span class="meta-label">День</span>
                <span class="meta-value">${escapeHtml(dayLabel(item.day))}</span>
              </div>
              <div class="meta-chip">
                <span class="meta-label">Час</span>
                <span class="meta-value">${escapeHtml(item.time || '')}</span>
              </div>
            </div>
          </div>
          <form class="form-grid" data-class-id="${escapeHtml(item.id)}">
            <div>
              <label>Ім'я</label>
              <input name="name" autocomplete="name" required placeholder="Як тебе записати">
            </div>
            <div>
              <span class="field-label">Формат</span>
              <input type="hidden" name="format" value="online">
              <div class="format-toggle" role="group" aria-label="Формат заняття">
                <button class="format-option active" type="button" data-format="online">Онлайн</button>
                <button class="format-option" type="button" data-format="offline">Офлайн</button>
              </div>
            </div>
            <button class="submit-button" type="submit">Записатися на заняття</button>
          </form>
        </article>
      `).join('');

      document.querySelectorAll('form[data-class-id]').forEach(form => {
        form.addEventListener('submit', addBooking);
        form.querySelectorAll('.format-option').forEach(button => {
          button.addEventListener('click', () => setFormat(form, button.dataset.format));
        });
      });
    }

    function renderBookings() {
      if (!state.bookings.length) {
        bookingsView.innerHTML = '<div class="notice">Записів поки немає.</div>';
        return;
      }

      bookingsView.innerHTML = state.bookings.map(item => {
        const classItem = state.classes.find(c => String(c.id) === String(item.classId));
        const title = classItem ? classItem.name : `Заняття #${item.classId}`;
        const date = item.timestamp ? new Date(item.timestamp).toLocaleString('uk-UA') : '';
        return `
          <article class="booking-card">
            <div class="booking-top">
              <div>
                <h2 class="booking-name">${escapeHtml(title)}</h2>
                <p class="meta booking-details">${escapeHtml(item.name || '')} · ${formatLabel(item.format)}<br>${escapeHtml(date)}</p>
              </div>
              <button class="delete" type="button" data-booking-id="${escapeHtml(item.id)}">Видалити</button>
            </div>
          </article>
        `;
      }).join('');

      document.querySelectorAll('[data-booking-id]').forEach(button => {
        button.addEventListener('click', deleteBooking);
      });
    }

    async function addBooking(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('.submit-button');
      button.disabled = true;

      try {
        const data = new FormData(form);
        const result = await request('addBooking', {
          method: 'POST',
          body: {
            classId: form.dataset.classId,
            name: data.get('name'),
            format: data.get('format')
          }
        });
        if (result.success) {
          form.reset();
          await loadData();
          showView('bookings');
        }
      } finally {
        button.disabled = false;
      }
    }

    function setFormat(form, format) {
      form.querySelector('input[name="format"]').value = format;
      form.querySelectorAll('.format-option').forEach(button => {
        button.classList.toggle('active', button.dataset.format === format);
      });
    }

    async function deleteBooking(event) {
      const button = event.currentTarget;
      button.disabled = true;

      try {
        const result = await request('deleteBooking', {
          method: 'POST',
          body: { id: button.dataset.bookingId }
        });
        if (result.success) {
          await loadData();
          showView('bookings');
        }
      } finally {
        button.disabled = false;
      }
    }

    function setLoading(isLoading) {
      state.loading = isLoading;
      if (isLoading) {
        classesView.innerHTML = '<div class="notice">Завантажую...</div>';
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[char]);
    }

    function formatLabel(value) {
      if (value === 'online') return 'Онлайн';
      if (value === 'offline') return 'Офлайн';
      return escapeHtml(value || '');
    }

    function dayLabel(value) {
      const days = {
        monday: 'Понеділок',
        tuesday: 'Вівторок',
        wednesday: 'Середа',
        thursday: 'Четвер',
        friday: 'Пʼятниця',
        saturday: 'Субота',
        sunday: 'Неділя'
      };
      const key = String(value || '').trim().toLowerCase();
      return days[key] || value || '';
    }

    loadData();
  </script>
</body>
</html>
