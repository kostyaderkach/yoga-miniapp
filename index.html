<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valeoyoga</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #eef3f6;
      --ink: #17201c;
      --muted: #667085;
      --line: #dce3ea;
      --sage: #18a38d;
      --sage-dark: #0b6f65;
      --clay: #ff8a65;
      --sky: #5d7cfa;
      --danger: #aa3328;
      --shadow: 0 18px 48px rgba(24, 33, 45, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #ffffff 0, rgba(255, 255, 255, 0) 280px),
        linear-gradient(135deg, rgba(24, 163, 141, 0.12), rgba(93, 124, 250, 0.08) 48%, rgba(255, 138, 101, 0.08)),
        var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 10px 10px 24px;
    }

    header {
      padding: 4px 0 10px;
    }

    .brand-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(31, 35, 33, 0.08);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(239, 247, 249, 0.92)),
        var(--surface);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .wordmark {
      margin: 0;
      color: var(--ink);
      font-size: 30px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 520px;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.38;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 5px;
      margin: 10px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 249, 0.7);
      box-shadow: 0 8px 24px rgba(68, 54, 43, 0.08);
    }

    .tab {
      min-height: 40px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--sage-dark), var(--sage));
      color: #fff;
      box-shadow: 0 8px 18px rgba(11, 111, 101, 0.2);
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .class-card,
    .booking-card,
    .notice {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid rgba(31, 35, 33, 0.08);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .class-card {
      overflow: hidden;
    }

    .class-hero {
      display: grid;
      gap: 10px;
      padding: 14px;
      background:
        linear-gradient(135deg, rgba(24, 163, 141, 0.12), rgba(255, 255, 255, 0.96) 54%, rgba(93, 124, 250, 0.08)),
        var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .class-top,
    .booking-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--sage-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .class-name,
    .booking-name {
      margin: 0;
      font-size: 24px;
      line-height: 1.04;
      font-weight: 850;
      letter-spacing: 0;
    }

    .booking-name {
      font-size: 22px;
    }

    .badge {
      flex: 0 0 auto;
      border: 1px solid rgba(47, 95, 73, 0.14);
      border-radius: 999px;
      background: #e8f7f4;
      color: var(--sage-dark);
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .session-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      border: 1px solid rgba(31, 35, 33, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      padding: 7px 10px;
    }

    .meta-value {
      display: inline;
      color: var(--ink);
      font-size: 14px;
      font-weight: 760;
    }

    .meta-icon {
      color: var(--sage-dark);
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .booking-card {
      overflow: hidden;
      padding: 0;
    }

    .booking-details {
      margin-top: 8px;
    }

    .booking-day {
      display: grid;
      gap: 8px;
    }

    .day-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 820;
      padding: 2px 2px 0;
    }

    .day-count {
      color: var(--sage-dark);
      font-size: 12px;
      font-weight: 780;
    }

    .admin-toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .filter-button {
      min-height: 40px;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .filter-button.active {
      background: linear-gradient(135deg, var(--sage-dark), var(--sage));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 18px rgba(11, 111, 101, 0.18);
    }

    .booking-class-head {
      display: grid;
      gap: 8px;
      padding: 13px;
      background:
        linear-gradient(135deg, rgba(24, 163, 141, 0.1), rgba(255, 255, 255, 0.96) 58%, rgba(93, 124, 250, 0.07)),
        var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .booking-class-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .booking-list {
      display: grid;
      gap: 1px;
      background: var(--line);
    }

    .booking-person {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      padding: 11px 13px;
    }

    .person-name {
      color: var(--ink);
      font-size: 15px;
      font-weight: 780;
      line-height: 1.25;
    }

    .person-format {
      display: inline-flex;
      width: fit-content;
      margin-top: 4px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 720;
    }

    .form-grid {
      display: grid;
      gap: 10px;
      padding: 14px;
      background: var(--surface);
    }

    .card-action {
      padding: 0 14px 14px;
      background: var(--surface);
    }

    .expand-button {
      width: 100%;
      min-height: 40px;
      background: #fff;
      color: var(--sage-dark);
      border: 1px solid rgba(11, 111, 101, 0.18);
      box-shadow: none;
    }

    label,
    .field-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 9px 12px;
      font: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    input:focus {
      border-color: rgba(95, 128, 104, 0.65);
      box-shadow: 0 0 0 4px rgba(95, 128, 104, 0.14);
    }

    input::placeholder {
      color: #9a948d;
    }

    .format-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .format-option {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 8px 10px;
      font: inherit;
      font-size: 14px;
      font-weight: 760;
      cursor: pointer;
    }

    .format-option.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 6px 16px rgba(68, 54, 43, 0.12);
    }

    .format-option[data-format="online"].active {
      color: var(--sage-dark);
    }

    .format-option[data-format="offline"].active {
      color: #a14c32;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      padding: 10px 14px;
      font: inherit;
      font-weight: 820;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .submit-button {
      width: 100%;
      margin-top: 0;
      background: linear-gradient(135deg, var(--sage-dark), var(--sage));
      box-shadow: 0 14px 24px rgba(47, 95, 73, 0.22);
    }

    .delete {
      min-height: 34px;
      background: #fff3f1;
      border: 1px solid rgba(170, 51, 40, 0.18);
      color: var(--danger);
      padding: 7px 10px;
      font-size: 12px;
    }

    .notice {
      padding: 18px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--muted);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {
      main {
        padding: 10px 8px 22px;
      }

      .brand-card {
        padding: 13px;
      }

      .wordmark {
        font-size: 28px;
      }

      .subtitle {
        font-size: 13px;
      }

      .class-name {
        font-size: 23px;
      }

      .class-hero,
      .form-grid {
        padding: 13px;
      }

      .class-top,
      .booking-top {
        align-items: flex-start;
      }

      .badge {
        width: fit-content;
      }

      .delete {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand-card">
        <h1 class="wordmark">Valeoyoga</h1>
        <p class="subtitle">Розклад на тиждень. Обери практику, формат і залиш ім'я для запису.</p>
      </div>
    </header>

    <div class="toolbar" role="tablist" aria-label="Розділи">
      <button class="tab active" id="classesTab" type="button">Розклад</button>
      <button class="tab" id="bookingsTab" type="button">Адмін</button>
    </div>

    <section id="classesView" class="stack"></section>
    <section id="bookingsView" class="stack hidden"></section>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxLBAyJqy1iO2Pvt97sUbqkqs7eZxlv3PZZYgdplA18tJBqqNWOsXCddAGg50_0Xch7/exec';
    const ADMIN_PASSWORD = 'admin';

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const telegramUserName = getTelegramUserName();

    const state = {
      classes: [],
      bookings: [],
      selectedClassId: null,
      isAdmin: false,
      bookingFilter: 'online',
      loading: false
    };

    const classesView = document.querySelector('#classesView');
    const bookingsView = document.querySelector('#bookingsView');
    const classesTab = document.querySelector('#classesTab');
    const bookingsTab = document.querySelector('#bookingsTab');

    classesTab.addEventListener('click', () => showView('classes'));
    bookingsTab.addEventListener('click', openAdmin);

    function openAdmin() {
      if (!state.isAdmin) {
        const pass = prompt('Пароль адміністратора:');
        if (pass !== ADMIN_PASSWORD) {
          bookingsView.innerHTML = '<div class="notice">Адмін-доступ не відкрито.</div>';
          return;
        }
        state.isAdmin = true;
      }

      showView('bookings');
    }

    function showView(view) {
      const isClasses = view === 'classes';
      classesTab.classList.toggle('active', isClasses);
      bookingsTab.classList.toggle('active', !isClasses);
      classesView.classList.toggle('hidden', !isClasses);
      bookingsView.classList.toggle('hidden', isClasses);
      if (!isClasses) renderBookings();
    }

    async function request(action, options = {}) {
      const url = options.method === 'POST' ? API_URL : `${API_URL}?action=${encodeURIComponent(action)}`;
      const response = await fetch(url, {
        method: options.method || 'GET',
        headers: options.method === 'POST' ? { 'Content-Type': 'text/plain;charset=utf-8' } : undefined,
        body: options.body ? JSON.stringify({ action, ...options.body }) : undefined
      });
      return response.json();
    }

    async function loadData() {
      setLoading(true);
      try {
        const [classes, bookings] = await Promise.all([
          request('getClasses'),
          request('getBookings')
        ]);
        state.classes = Array.isArray(classes) ? classes : [];
        state.bookings = Array.isArray(bookings) ? bookings : [];
        renderClasses();
        renderBookings();
      } catch (error) {
        classesView.innerHTML = `<div class="notice">Не вдалося завантажити дані. Перевір API URL і доступ до Apps Script.</div>`;
      } finally {
        setLoading(false);
      }
    }

    function renderClasses() {
      if (!state.classes.length) {
        classesView.innerHTML = '<div class="notice">Поки немає занять. Додай рядки на аркуш Classes у Google Таблиці.</div>';
        return;
      }

      classesView.innerHTML = state.classes.map(item => {
        const isSelected = String(state.selectedClassId) === String(item.id);

        return `
        <article class="class-card ${isSelected ? 'selected' : ''}">
          <div class="class-hero">
            <div class="class-top">
              <div>
                <p class="eyebrow">Доступне заняття</p>
                <h2 class="class-name">${escapeHtml(item.name || 'Заняття')}</h2>
              </div>
              <span class="badge">${escapeHtml(item.offlineSpots || '0')} місць</span>
            </div>
            <div class="session-meta">
              <div class="meta-chip">
                <svg class="meta-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M7 3v3M17 3v3M4.5 9.5h15M6.5 5h13v14.5h-15V5h2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="meta-value">${escapeHtml(dayLabel(item.day))}</span>
              </div>
              <div class="meta-chip">
                <svg class="meta-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 7v5l3 2M20 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="meta-value">${escapeHtml(timeLabel(item.time))}</span>
              </div>
            </div>
          </div>
          ${isSelected ? `
          <form class="form-grid" data-class-id="${escapeHtml(item.id)}">
            <div>
              <label>Ім'я</label>
              <input name="name" autocomplete="name" required placeholder="Як тебе записати" value="${escapeHtml(telegramUserName)}">
            </div>
            <div>
              <span class="field-label">Формат</span>
              <input type="hidden" name="format" value="online">
              <div class="format-toggle" role="group" aria-label="Формат заняття">
                <button class="format-option active" type="button" data-format="online">Онлайн</button>
                <button class="format-option" type="button" data-format="offline">Офлайн</button>
              </div>
            </div>
            <button class="submit-button" type="submit">Записатися на заняття</button>
          </form>
          ` : `
          <div class="card-action">
            <button class="expand-button" type="button" data-select-class="${escapeHtml(item.id)}">Обрати заняття</button>
          </div>
          `}
        </article>
      `;
      }).join('');

      document.querySelectorAll('form[data-class-id]').forEach(form => {
        form.addEventListener('submit', addBooking);
        form.querySelectorAll('.format-option').forEach(button => {
          button.addEventListener('click', () => setFormat(form, button.dataset.format));
        });
      });

      document.querySelectorAll('[data-select-class]').forEach(button => {
        button.addEventListener('click', () => {
          state.selectedClassId = button.dataset.selectClass;
          renderClasses();
        });
      });
    }

    function renderBookings() {
      if (!state.isAdmin) {
        bookingsView.innerHTML = '<div class="notice">Цей розділ доступний тільки адміністратору.</div>';
        return;
      }

      if (!state.bookings.length) {
        bookingsView.innerHTML = `${renderAdminToolbar()}<div class="notice">Записів поки немає.</div>`;
        bindBookingFilters();
        return;
      }

      const filteredBookings = state.bookings.filter(item => item.format === state.bookingFilter);

      if (!filteredBookings.length) {
        bookingsView.innerHTML = `${renderAdminToolbar()}<div class="notice">Записів ${formatLabel(state.bookingFilter).toLowerCase()} поки немає.</div>`;
        bindBookingFilters();
        return;
      }

      const classById = new Map(state.classes.map(item => [String(item.id), item]));
      const classOrder = new Map(state.classes.map((item, index) => [String(item.id), index]));
      const dayGroups = new Map();

      filteredBookings.forEach(item => {
        const classItem = classById.get(String(item.classId));
        const day = dayLabel(classItem && classItem.day ? classItem.day : 'Без дня');
        const classKey = String(item.classId || item.id);

        if (!dayGroups.has(day)) {
          dayGroups.set(day, new Map());
        }

        const classesForDay = dayGroups.get(day);
        if (!classesForDay.has(classKey)) {
          classesForDay.set(classKey, {
            classItem,
            classId: item.classId,
            bookings: []
          });
        }

        classesForDay.get(classKey).bookings.push(item);
      });

      bookingsView.innerHTML = renderAdminToolbar() + Array.from(dayGroups.entries()).map(([day, classesForDay]) => {
        const dayBookingsCount = Array.from(classesForDay.values())
          .reduce((sum, group) => sum + group.bookings.length, 0);
        const classGroups = Array.from(classesForDay.values())
          .sort((a, b) => (classOrder.get(String(a.classId)) ?? 999) - (classOrder.get(String(b.classId)) ?? 999));

        return `
          <section class="booking-day">
            <div class="day-title">
              <span>${escapeHtml(day)}</span>
              <span class="day-count">${dayBookingsCount} ${pluralPeople(dayBookingsCount)}</span>
            </div>
            ${classGroups.map(group => {
              const classItem = group.classItem;
              const title = classItem ? classItem.name : `Заняття #${group.classId}`;
              return `
                <article class="booking-card">
                  <div class="booking-class-head">
                    <div class="booking-class-row">
                      <h2 class="booking-name">${escapeHtml(title)}</h2>
                      <span class="badge">${group.bookings.length} ${pluralPeople(group.bookings.length)}</span>
                    </div>
                    <div class="session-meta">
                      <div class="meta-chip">
                        <svg class="meta-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                          <path d="M12 7v5l3 2M20 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span class="meta-value">${escapeHtml(timeLabel(classItem && classItem.time ? classItem.time : ''))}</span>
                      </div>
                    </div>
                  </div>
                  <div class="booking-list">
                    ${group.bookings.map(booking => `
                      <div class="booking-person">
                        <div>
                          <div class="person-name">${escapeHtml(booking.name || 'Без імені')}</div>
                          <span class="person-format">${formatLabel(booking.format)}</span>
                        </div>
                        <button class="delete" type="button" data-booking-id="${escapeHtml(booking.id)}">Видалити</button>
                      </div>
                    `).join('')}
                  </div>
                </article>
              `;
            }).join('')}
          </section>
        `;
      }).join('');

      document.querySelectorAll('[data-booking-id]').forEach(button => {
        button.addEventListener('click', deleteBooking);
      });
      bindBookingFilters();
    }

    function renderAdminToolbar() {
      return `
        <div class="admin-toolbar" role="group" aria-label="Фільтр записів">
          <button class="filter-button ${state.bookingFilter === 'online' ? 'active' : ''}" type="button" data-booking-filter="online">Онлайн</button>
          <button class="filter-button ${state.bookingFilter === 'offline' ? 'active' : ''}" type="button" data-booking-filter="offline">Офлайн</button>
        </div>
      `;
    }

    function bindBookingFilters() {
      document.querySelectorAll('[data-booking-filter]').forEach(button => {
        button.addEventListener('click', () => {
          state.bookingFilter = button.dataset.bookingFilter;
          renderBookings();
        });
      });
    }

    async function addBooking(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('.submit-button');
      button.disabled = true;

      try {
        const data = new FormData(form);
        const result = await request('addBooking', {
          method: 'POST',
          body: {
            classId: form.dataset.classId,
            name: data.get('name'),
            format: data.get('format')
          }
        });
        if (result.success) {
          form.reset();
          await loadData();
          state.selectedClassId = null;
          showView('classes');
        }
      } finally {
        button.disabled = false;
      }
    }

    function setFormat(form, format) {
      form.querySelector('input[name="format"]').value = format;
      form.querySelectorAll('.format-option').forEach(button => {
        button.classList.toggle('active', button.dataset.format === format);
      });
    }

    async function deleteBooking(event) {
      const button = event.currentTarget;
      button.disabled = true;

      try {
        const result = await request('deleteBooking', {
          method: 'POST',
          body: { id: button.dataset.bookingId }
        });
        if (result.success) {
          await loadData();
          if (state.isAdmin) showView('bookings');
        }
      } finally {
        button.disabled = false;
      }
    }

    function setLoading(isLoading) {
      state.loading = isLoading;
      if (isLoading) {
        classesView.innerHTML = '<div class="notice">Завантажую...</div>';
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[char]);
    }

    function formatLabel(value) {
      if (value === 'online') return 'Онлайн';
      if (value === 'offline') return 'Офлайн';
      return escapeHtml(value || '');
    }

    function pluralPeople(count) {
      const mod10 = count % 10;
      const mod100 = count % 100;
      if (mod10 === 1 && mod100 !== 11) return 'людина';
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return 'людини';
      return 'людей';
    }

    function getTelegramUserName() {
      const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (!user) return '';

      const fullName = [user.first_name, user.last_name]
        .filter(Boolean)
        .join(' ')
        .trim();

      return fullName || user.username || '';
    }

    function dayLabel(value) {
      const days = {
        monday: 'Понеділок',
        tuesday: 'Вівторок',
        wednesday: 'Середа',
        thursday: 'Четвер',
        friday: 'Пʼятниця',
        saturday: 'Субота',
        sunday: 'Неділя'
      };
      const key = String(value || '').trim().toLowerCase();
      return days[key] || value || '';
    }

    function timeLabel(value) {
      const raw = String(value || '').trim();
      const match = raw.match(/^(\d{1,2}):(\d{2})(?::\d{2})?(?:\s?[AP]M)?$/i);
      if (!match) return raw;
      return `${match[1].padStart(2, '0')}:${match[2]}`;
    }

    loadData();
  </script>
</body>
</html>
